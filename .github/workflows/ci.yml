# Builds the whole solution and runs the tests on every push to main and every pull request
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tests only reference Pama.Core, so build the solution to catch Desktop errors too
      - name: Build
        run: dotnet build Pama.slnx -c Release

      - name: Test
        run: dotnet test Pama.slnx -c Release --no-build
