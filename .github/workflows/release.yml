# Pushing a tag vX.Y.Z builds Pama, attests the exes and publishes them as a GitHub release
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The app version comes from CHANGELOG.md, so a mismatched tag would ship a mislabelled exe
      - name: Check tag matches CHANGELOG version
        run: |
          version=$(grep -oPm1 '(?<=^## \[)\d+\.\d+\.\d+(?=\])' CHANGELOG.md)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CHANGELOG version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/win-x64/Pama.exe
            artifacts/win-x64-slim/Pama-slim.exe

      - name: Extract release notes
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > artifacts/RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pama $VERSION" \
            --notes-file artifacts/RELEASE_NOTES.md \
            artifacts/win-x64/Pama.exe \
            artifacts/win-x64-slim/Pama-slim.exe \
            artifacts/SHA256SUMS
